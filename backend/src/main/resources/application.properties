# PostgreSQL Connection Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/flowboard
spring.datasource.username=flowboard
spring.datasource.password=flowboard
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# JWT Configuration Properties
flowboard.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
flowboard.app.jwtExpirationMs=86400000

# Enable sample data option
flowboard.app.loadSampleData=true
